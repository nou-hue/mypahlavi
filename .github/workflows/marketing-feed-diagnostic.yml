name: Marketing feed diagnostic

on:
  push:
    branches:
      - marketing/live-catalog-feeds-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build application
        run: npx vite build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
