name: Shop route diagnostic

on:
  push:
    branches:
      - fix/shop-canonical-route-2026-09-20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build application
        run: npx vite build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
