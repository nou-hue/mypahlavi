name: Marketing feed fail-closed diagnostic

on:
  push:
    branches:
      - marketing/feed-fail-closed-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: npm run typecheck
      - run: npm run lint
